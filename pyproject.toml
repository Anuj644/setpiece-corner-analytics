[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setpiece"
version = "0.1.0"
description = "Reproducible corner-kick analytics on StatsBomb Open Data"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "jinja2",
    "pyyaml",
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = ["data: needs the local StatsBomb cache"]

[tool.ruff]
line-length = 100
